<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E" />
      <stop offset="50%" stop-color="#E11D48" />
      <stop offset="100%" stop-color="#991B1B" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Dark Container -->
  <rect width="100" height="100" rx="28" fill="#0B0F19" />
  
  <!-- Border Gradient Ring -->
  <rect x="3" y="3" width="94" height="94" rx="25" fill="none" stroke="url(#borderGrad)" stroke-width="4" />
  
  <!-- Glowing Background Radial Blob -->
  <circle cx="50" cy="50" r="30" fill="url(#roseGrad)" opacity="0.3" filter="url(#glow)" />
  
  <!-- AI Neural Nodes -->
  <circle cx="22" cy="22" r="3.5" fill="#F43F5E" opacity="0.8" />
  <circle cx="78" cy="22" r="3.5" fill="#F43F5E" opacity="0.8" />
  <circle cx="22" cy="78" r="3.5" fill="#F43F5E" opacity="0.8" />
  <circle cx="78" cy="78" r="3.5" fill="#F43F5E" opacity="0.8" />
  <line x1="22" y1="22" x2="33" y2="33" stroke="#F43F5E" stroke-width="1.5" opacity="0.4" />
  <line x1="78" y1="22" x2="67" y2="33" stroke="#F43F5E" stroke-width="1.5" opacity="0.4" />
  <line x1="22" y1="78" x2="33" y2="67" stroke="#F43F5E" stroke-width="1.5" opacity="0.4" />
  <line x1="78" y1="78" x2="67" y2="67" stroke="#F43F5E" stroke-width="1.5" opacity="0.4" />

  <!-- Monogram SS Logo Text -->
  <text x="50" y="65" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="46" fill="url(#roseGrad)" text-anchor="middle" letter-spacing="-1">SS</text>
</svg>